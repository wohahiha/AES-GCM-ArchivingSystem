[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-gcm-archiving-system"
version = "0.1.0"
description = "AES-GCM and Merkle based private document archiving command line prototype"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

